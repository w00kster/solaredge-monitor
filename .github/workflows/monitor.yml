name: SolarEdge Monitoring

# Run on a schedule optimized for solar detection
# Fixed cron syntax: every 20min 6am-7:40pm, hourly 8pm-5am
on:
  schedule:
    # AEST (UTC+10) conversion:
    # - Daylight: AEST 06:00–19:40 -> UTC hours 20–23 and 00–09 -> every 20 minutes
    - cron: '*/20 20-23,0-9 * * *'    # runs at minutes 0,20,40 during AEST 06:00–19:40
    # - Night: AEST 20:00–05:00 -> UTC hours 10–19 -> hourly at minute 0
    - cron: '0 10-19 * * *'          # runs hourly at minute 0 during AEST 20:00–05:00
  workflow_dispatch:        # Allow manual triggering
    inputs:
      log-level:
        description: 'Log level'
        required: false
        default: 'info'
        options: ['debug', 'info', 'warning']
      force-commit:
        description: 'Force commit data changes'
        required: false
        default: 'false'
        options: ['true', 'false']

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Get all history for better diff tracking

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run SolarEdge monitor
      env:
        SOLAREDGE_USERNAME: ${{ secrets.SOLAREDGE_USERNAME }}
        SOLAREDGE_PASSWORD: ${{ secrets.SOLAREDGE_PASSWORD }}
      run: npm run monitor

    - name: Commit data changes
      if: success() && github.event_name != 'workflow_dispatch' || inputs.force-commit == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        echo "=== DEBUG: Checking data directory ==="
        ls -la data/
        echo "=== END DEBUG ==="

        # Check if there are any changes to commit
        echo "Checking for changes with git diff --quiet..."
        if git diff --quiet; then
          echo "No data changes to commit according to git diff --quiet"
          echo "Running git diff --stat to see what changed:"
          git diff --stat || echo "git diff --stat failed or showed no changes"
          echo "Checking if data files exist and their content:"
          if [ -f "data/latest.json" ]; then
            echo "latest.json exists, first 100 chars:"
            head -c 100 data/latest.json | cat -A
            echo ""
          else
            echo "latest.json does NOT exist"
          fi
          if [ -f "data/historical.json" ]; then
            echo "historical.json exists, first 100 chars:"
            head -c 100 data/historical.json | cat -A
            echo ""
          else
            echo "historical.json does NOT exist"
          fi
        else
          echo "Data changes detected, proceeding with commit..."
          git add data/
          echo "Files staged for commit:"
          git status --porcelain
          echo "Attempting commit..."
          git commit -m "SolarEdge data update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || {
            echo "ERROR: Commit failed";
            exit 1;
          }
          echo "Commit successful, attempting push..."
          git push origin HEAD:${{ github.ref }} || {
            echo "ERROR: Push failed";
            exit 1;
          }
          echo "Push successful"
        fi

    - name: Generate and deploy dashboard
      if: success()  # Always try to update dashboard
      run: |
        npm run generate-dashboard

        # Configure git for Pages deployment
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Add and commit dashboard updates
        git add public/
        if ! git diff --cached --quiet; then
          git commit -m "Dashboard update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push origin HEAD:${{ github.ref }}
        else
          echo "No dashboard changes to commit"
        fi